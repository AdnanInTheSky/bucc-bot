# fly.toml app configuration file generated for bucc-discord-bot
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "bucc-discord-bot"
primary_region = "sin"

[build]
  [build.args]
    PYTHON_VERSION = "3.11"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
